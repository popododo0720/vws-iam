# Common insider-risk workflow for pull requests. Copy this file, direct-push-watch.yml and
# scripts/guard-agents.sh as-is into another repo.
# The repo is private on a free plan, so branch protection is unavailable. These checks replace it.
# The push check lives in its own file so that a pull request run has no skipped check.
name: repo-guard

on:
  pull_request:
    # labeled/unlabeled re-run verify-gate when vws-verify approves or the label is removed (#249).
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base is the main branch
        env:
          GUARD_MAIN_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/guard-agents.sh pr-base "$BASE_REF"
      - name: Body says Part of #N and closes no issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/guard-agents.sh pr-body
      - name: No commit closes an issue
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/guard-agents.sh pr-commits "$BASE_SHA" "$HEAD_SHA"
      - name: guard-agents.sh is the canonical vws-deploy copy
        run: scripts/guard-agents.sh identity scripts/guard-agents.sh.sha256
      - name: AGENTS.md has the guardrails
        run: scripts/guard-agents.sh agents

  # verify-gate (#249): red unless the PR has the verify-approved label and a comment with a
  # "Verified-by: vws-verify" section that names the current head SHA with evidence for every docs/QUALITY.md
  # item. The PR body never counts. A push changes the head, so an old approval no longer counts.
  # When the repo variable VWS_VERIFY_ACTORS (comma list of logins) is set, the comment author and whoever last
  # added the label must be in it. The PR author and the head commit's pusher (GUARD_VERIFY_EXCLUDE) never
  # approve, unless the login is the vws-verify identity (repo variable VWS_VERIFY_IDENTITY).
  # Limits (docs/QUALITY.md "Known gaps"): on pull_request GitHub runs this YAML from the PR's merge commit,
  # so a PR CAN edit this job. Only the guard script is taken from the base commit, which stops a PR from
  # quietly weakening the script but not from rewriting this YAML. All bots share one account, so the actor
  # check cannot tell vws-verify from the PR author.
  verify-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Approved for this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GUARD_VERIFY_ACTORS: ${{ vars.VWS_VERIFY_ACTORS }}
          GUARD_VERIFY_IDENTITY: ${{ vars.VWS_VERIFY_IDENTITY }}
        run: |
          set -euo pipefail
          # Bootstrap: the guard script comes from the base commit. Before this repo's main has a copy with the
          # verify-gate command (the PR that adopts it), there is nothing trusted to run, so the gate reports that
          # and passes. A PR cannot change the base copy, and every later PR runs the real gate.
          if ! grep -q '^  verify-gate)' scripts/guard-agents.sh; then
            echo "::warning::bootstrap: the base guard-agents.sh has no verify-gate command; the gate starts after this merges"
            exit 0
          fi
          # Labels as they are now, not the event snapshot (a re-run replays the original event).
          LABELS=$(gh api "repos/${REPO}/issues/${NUMBER}/labels" --jq '[.[].name] | join(",")')
          text=$(mktemp)
          # One "@@comment-by: LOGIN" block per comment, from the API's author field. A body line that
          # imitates the marker is defanged so a comment cannot claim another author. Control characters are
          # normalized first (CRLF to LF, any other one to "?"), so "\r@@comment-by:" cannot slip past the defang.
          gh api --paginate "repos/${REPO}/issues/${NUMBER}/comments" \
            --jq '.[] | "@@comment-by: \(.user.login)\n\(.body | gsub("\r\n"; "\n")
              | gsub("[\u0000-\u0008\u000b-\u001f\u007f]"; "?") | gsub("(?m)^@@comment-by:"; "@ @comment-by:"))"' >"$text"
          # Who last added the label, from the issue events.
          GUARD_VERIFY_LABELER=$(gh api --paginate "repos/${REPO}/issues/${NUMBER}/events" \
            --jq '.[] | select(.event == "labeled" and .label.name == "verify-approved") | .actor.login' | tail -n 1)
          # The head pusher: the actor of the push that set the head ref to HEAD_SHA (repository activity API),
          # not the commit's committer field, which anyone can set. No matching push fails closed. The
          # committer's linked login stays excluded as well.
          # Every activity type counts (push, force_push, branch_creation, ...); -f encodes the ref.
          pusher=$(gh api -X GET "repos/${HEAD_REPO}/activity" -f ref="refs/heads/${HEAD_REF}" -F per_page=100 \
            --jq "[.[] | select(.after == \"${HEAD_SHA}\")][0].actor.login // \"\"")
          if [[ -z $pusher ]]; then
            echo "verify-gate: no push of ${HEAD_SHA} to ${HEAD_REPO} ${HEAD_REF} found; cannot tell who pushed the head" >&2
            exit 1
          fi
          committer=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.committer.login // ""')
          GUARD_VERIFY_EXCLUDE="${PR_AUTHOR},${pusher},${committer}"
          export GUARD_VERIFY_LABELER GUARD_VERIFY_EXCLUDE
          scripts/guard-agents.sh verify-gate "$HEAD_SHA" "$LABELS" "$text"

  # A new push drops the approval label as well; the head check above already fails without it.
  # Only this job may write, and only labels (issues: write). It checks out nothing and runs no PR code.
  verify-reset:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove verify-approved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [[ ",${LABELS}," == *",verify-approved,"* ]]; then
            gh api -X DELETE "repos/${REPO}/issues/${NUMBER}/labels/verify-approved" >/dev/null
            echo "verify-approved removed: a new head needs a new verification"
          fi
