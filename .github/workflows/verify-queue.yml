# Copy unchanged to every vws-* repo with repo-guard.yml (see docs/factory-orchestrator.md, vws-deploy#397).
# Keeps the needs-verify label on a PR exactly while it waits for vws-verify: open, not a draft, base main,
# no verify-approved, no vws-verify FAIL verdict on its head (vws-deploy#440), and every check on its head
# green except verify-gate and vws-verify (which wait for the verdict by design). The orchestrator's verify
# wake (Rule A) counts only labeled PRs, so a head verify already failed must not wake it again.
# It reads the PR, its check runs and commit statuses through the API and writes only labels: it checks
# out nothing and runs no PR code. Label writes made with this token start no new workflow runs.
name: verify-queue

on:
  # Runs from the default branch after these workflows finish on a PR head: every workflow that runs on
  # pull_request in any vws-* repo (vws-console names its CI "CI"; vws-proto has buf; vws-conformance has
  # conformance; vws-console-api has the path-filtered tla). Any of them can finish last, and a missing one
  # leaves the PR unlabeled; tests/workflows/test_verify_queue.py fails when a pull_request workflow in this
  # repo, or a known one of another vws-* repo, is not listed. A name a repo does not have is ignored. Not
  # check_suite: GitHub starts no workflow for check suites created by GitHub Actions. post-merge (closed
  # PRs) only clears a stale label.
  workflow_run:
    workflows: [buf, ci, CI, conformance, drift-check, english, installer-image, post-merge, repo-guard, tla]
    types: [completed]
  pull_request:
    types: [ready_for_review, synchronize]
  # A vws-verify verdict review takes the label off at once when it fails the head (vws-deploy#440).
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  needs-verify:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow's. Adding or removing a label on a PR goes through the
    # issues API but needs pull-requests: write as well (without it: 403 "Resource not accessible by
    # integration"). Writes are labels only; checks and statuses are read.
    permissions:
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Label PRs whose CI is green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PRS: ${{ github.event_name == 'workflow_run' && join(github.event.workflow_run.pull_requests.*.number, ' ') || github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Checks that wait for the verdict, plus this job's own check on pull_request events.
          skip="verify-gate vws-verify needs-verify"
          unlabel() {
            # A label that is already gone (HTTP 404) is the wanted state; other errors fail.
            if out=$(gh api -X DELETE "repos/${REPO}/issues/$1/labels/needs-verify" 2>&1); then
              echo "#$1: needs-verify removed ($2)"
            elif [[ $out == *"HTTP 404"* ]]; then
              echo "#$1: no needs-verify label ($2)"
            else
              echo "$out" >&2
              return 1
            fi
          }
          # vws-deploy#440: a FAIL verdict on this exact head keeps the PR out of the queue until a new push.
          # The newest verdict on the head counts: a vws-verify[bot] review (CHANGES_REQUESTED = FAIL,
          # APPROVED = PASS) or a "# <repo>#N @ <sha>\nResult: FAIL|PASS" comment by vws-verify[bot] or a
          # repo member (the bots share one account). A vws-verify check run that failed on the head also counts.
          # Prints the FAIL source, or nothing. Reads only; a failed read fails the job (fail closed).
          head_fail() {
            local n=$1 sha=$2 target="${REPO#*/}#$1" verdicts
            verdicts=$( {
              gh api --paginate "repos/${REPO}/pulls/${n}/reviews?per_page=100" | jq -rs --arg sha "$sha" '
                (add // [])[] | select(.user.login == "vws-verify[bot]" and .commit_id == $sha and .submitted_at != null
                  and (.state == "APPROVED" or .state == "CHANGES_REQUESTED"))
                | [.submitted_at, (if .state == "CHANGES_REQUESTED" then "FAIL" else "PASS" end), "review \(.id)"] | @tsv' || exit 1
              gh api --paginate "repos/${REPO}/issues/${n}/comments?per_page=100" | jq -rs --arg sha "$sha" --arg target "$target" '
                (add // [])[] | select(.user.login == "vws-verify[bot]" or (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")))
                | ((.body // "") | gsub("\r\n"; "\n") | sub("\\A\\s+"; "")) as $b
                | ($b | capture("\\A#\\s+(?<t>[A-Za-z0-9._-]+#[0-9]+)\\s+@\\s+(?<s>[0-9a-f]{40})\\s*\n+Result:\\s*(?<r>PASS|FAIL)\\b")? ) as $m
                | select($m != null and $m.t == $target and $m.s == $sha)
                | [.created_at, $m.r, "comment \(.id)"] | @tsv' || exit 1
            } | sort | tail -n 1) || return 1
            if [[ $verdicts == *$'\tFAIL\t'* ]]; then echo "verdict ${verdicts##*$'\t'}"; return; fi
            awk -F'\t' '$1 == "vws-verify" && $2 + 0 > id { id = $2 + 0; r = $3 "/" $4 }
              END { if (r == "completed/failure") print "vws-verify check failure" }' "$tmp/checks"
          }
          if [[ $EVENT == pull_request && $ACTION == synchronize ]]; then
            unlabel "$PRS" "new push"
            exit 0
          fi
          [[ -n ${PRS// /} ]] || { echo "no same-repo PR for this run"; exit 0; }
          tmp=$(mktemp -d)
          for n in $PRS; do
            IFS=$'\t' read -r state draft base sha labels < <(gh api "repos/${REPO}/pulls/${n}" \
              --jq '[.state, (.draft | tostring), .base.ref, .head.sha, ([.labels[].name] | join(","))] | @tsv')
            if [[ $sha != "$HEAD_SHA" ]]; then
              echo "#$n: head moved to ${sha:0:7}; the runs for the new head decide"
              continue
            fi
            if [[ $state != open || $draft == true || $base != main || ",$labels," == *",verify-approved,"* ]]; then
              if [[ ",$labels," == *",needs-verify,"* ]]; then unlabel "$n" "not waiting for verify"; fi
              continue
            fi
            gh api --paginate "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, (.id | tostring), .status, (.conclusion // "")] | @tsv' >"$tmp/checks"
            gh api "repos/${REPO}/commits/${sha}/status" --jq '.statuses[] | [.context, .state] | @tsv' >"$tmp/statuses"
            # The newest run per check name counts (a rerun supersedes a failed attempt).
            verdict=$(awk -F'\t' -v skip="$skip" '
              BEGIN { n = split(skip, s, " "); for (i = 1; i <= n; i++) sk[s[i]] = 1 }
              FILENAME == ARGV[1] { if (!($1 in sk) && (!($1 in id) || $2 + 0 > id[$1])) { id[$1] = $2 + 0; st[$1] = $3; co[$1] = $4 }; next }
              !($1 in sk) { seen++; if ($2 == "failure" || $2 == "error") red = red " " $1; else if ($2 != "success") pend = pend " " $1 }
              END {
                for (k in id) {
                  seen++
                  if (st[k] != "completed") pend = pend " " k
                  else if (co[k] != "success" && co[k] != "neutral" && co[k] != "skipped") red = red " " k
                }
                if (red != "") print "red:" red; else if (pend != "" || seen == 0) print "pending:" pend; else print "green"
              }' "$tmp/checks" "$tmp/statuses")
            echo "#$n@${sha:0:7}: CI $verdict"
            case "$verdict" in
              green)
                fail=$(head_fail "$n" "$sha")
                if [[ -n $fail ]]; then
                  echo "#$n@${sha:0:7}: FAIL on this head ($fail); a new push re-enters the queue"
                  if [[ ",$labels," == *",needs-verify,"* ]]; then unlabel "$n" "verify FAIL on this head"; fi
                elif [[ ",$labels," != *",needs-verify,"* ]]; then
                  gh api -X POST "repos/${REPO}/issues/${n}/labels" -f "labels[]=needs-verify" >/dev/null
                  echo "#$n: needs-verify added"
                fi ;;
              red*)
                if [[ ",$labels," == *",needs-verify,"* ]]; then unlabel "$n" "a check is red"; fi ;;
            esac
          done
