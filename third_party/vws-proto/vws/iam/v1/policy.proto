syntax = "proto3";

package vws.iam.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/iam/v1;iamv1";
option java_multiple_files = true;
option java_outer_classname = "PolicyProto";
option java_package = "dev.vws.iam.v1";

// PolicyService manages customer managed policies and their versions.
// Policy documents are AWS JSON (Version "2012-10-17"): Statement with Sid,
// Effect, Action/NotAction, Resource/NotResource, Principal (trust policies
// only), Condition. A document the evaluator cannot parse, or with a
// condition operator or key outside docs/iam.md, is INVALID_ARGUMENT /
// INVALID_SPEC and stores nothing. At most 6144 characters without whitespace.
// No node reconciles IAM. The server writes the resource and its status
// (observed.state READY, observed.generation = generation) in one store, so
// every operation of this service is returned done.
// A policy keeps at most 5 versions; a sixth is RESOURCE_EXHAUSTED /
// QUOTA_EXCEEDED. Delete of a policy is FAILED_PRECONDITION /
// DEPENDENCY_MISSING while it is attached. The default version cannot be deleted.
// A policy keeps at most 50 tags, stored with the policy and not in its
// envelope labels (AWS tag keys and values allow characters and lengths the
// envelope labels do not). Tag and Untag are INVALID_ARGUMENT / INVALID_SPEC
// for an invalid tag, and RESOURCE_EXHAUSTED / QUOTA_EXCEEDED past 50 tags.
service PolicyService {
  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetPolicy(GetPolicyRequest) returns (Policy) {
    option (google.api.http) = {get: "/v1/{name=projects/*/policies/*}"};
  }

  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/policies"};
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreatePolicy(CreatePolicyRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/policies"
      body: "policy"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Policy"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdatePolicy(UpdatePolicyRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{policy.name=projects/*/policies/*}"
      body: "policy"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Policy"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeletePolicy(DeletePolicyRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/policies/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Policy"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetPolicyVersion(GetPolicyVersionRequest) returns (PolicyVersion) {
    option (google.api.http) = {get: "/v1/{name=projects/*/policies/*/versions/*}"};
  }

  rpc ListPolicyVersions(ListPolicyVersionsRequest) returns (ListPolicyVersionsResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*/policies/*}/versions"};
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreatePolicyVersion(CreatePolicyVersionRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/policies/*}/versions"
      body: "policy_version"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.PolicyVersion"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeletePolicyVersion(DeletePolicyVersionRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/policies/*/versions/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.PolicyVersion"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc TagPolicy(TagPolicyRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/policies/*}:tag"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Policy"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UntagPolicy(UntagPolicyRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/policies/*}:untag"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Policy"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  rpc ListPolicyTags(ListPolicyTagsRequest) returns (ListPolicyTagsResponse) {
    option (google.api.http) = {get: "/v1/{name=projects/*/policies/*}:tags"};
  }
}

// Policy is a customer managed policy.
// Fields 1-10 are the shared resource envelope.
message Policy {
  option (google.api.resource) = {
    type: "vws.iam/Policy"
    pattern: "projects/{project}/policies/{policy}"
    plural: "policies"
    singular: "policy"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  PolicySpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  PolicyStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message PolicySpec {
  string path = 1;
  string description = 2;
  // Document of version v1. Input on create only; later documents are
  // CreatePolicyVersion.
  string document = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Version used for evaluation, for example "v2". Empty on create means v1.
  // Changing it is SetDefaultPolicyVersion.
  string default_version = 4;
}

message PolicyStatus {
  vws.common.v1.ObservedState observed = 1;
  // arn:vws:iam::{project}:policy{path}{policy}
  string arn = 2;
  // "ANPA" followed by 17 uppercase letters and digits.
  string unique_id = 3;
  // Users, groups, and roles that attach it.
  int32 attachment_count = 4;
}

// PolicyVersion is one immutable document of a policy. Its id is v1, v2, ...
// Fields 1-10 are the shared resource envelope.
message PolicyVersion {
  option (google.api.resource) = {
    type: "vws.iam/PolicyVersion"
    pattern: "projects/{project}/policies/{policy}/versions/{version}"
    plural: "versions"
    singular: "version"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  PolicyVersionSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  PolicyVersionStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message PolicyVersionSpec {
  string document = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Create only: make this version the default.
  bool set_as_default = 2 [(google.api.field_behavior) = INPUT_ONLY];
}

message PolicyVersionStatus {
  vws.common.v1.ObservedState observed = 1;
  bool default_version = 2;
}

message GetPolicyRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Policy"
  ];
}

message ListPoliciesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/Policy"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListPoliciesResponse {
  repeated Policy policies = 1;
  string next_page_token = 2;
}

message CreatePolicyRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/Policy"
  ];
  // Final path segment. Must match IamName, up to 128 characters.
  string policy_id = 2 [(google.api.field_behavior) = REQUIRED];
  Policy policy = 3 [(google.api.field_behavior) = REQUIRED];
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message UpdatePolicyRequest {
  Policy policy = 1 [(google.api.field_behavior) = REQUIRED];
  // Paths are relative to Policy. status and output-only fields are rejected.
  // Omitted mask is treated as "spec,labels".
  // spec.document is immutable here: a new document is CreatePolicyVersion.
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  bool allow_missing = 5 [(google.api.field_behavior) = OPTIONAL];
}

message DeletePolicyRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Policy"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

message GetPolicyVersionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/PolicyVersion"
  ];
}

message ListPolicyVersionsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/PolicyVersion"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListPolicyVersionsResponse {
  repeated PolicyVersion policy_versions = 1;
  string next_page_token = 2;
}

message CreatePolicyVersionRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/PolicyVersion"
  ];
  // Final path segment. Ignored: the server names versions v1, v2, ... and returns the name.
  string policy_version_id = 2 [(google.api.field_behavior) = REQUIRED];
  PolicyVersion policy_version = 3 [(google.api.field_behavior) = REQUIRED];
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message DeletePolicyVersionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/PolicyVersion"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Tag is one key-value tag on an IAM policy, as in AWS IAM.
message Tag {
  // 1-128 characters of letters, digits, spaces and _ . : / = + - @.
  // A key may not begin with aws:.
  string key = 1 [(google.api.field_behavior) = REQUIRED];
  // 0-256 characters of the same alphabet. A value may not begin with
  // aws:. Both are case sensitive for a policy.
  string value = 2 [(google.api.field_behavior) = REQUIRED];
}

// TagPolicy adds or overwrites tags on a managed policy. The whole request
// fails and stores nothing when one tag is invalid, a key repeats, or the
// policy would keep more than 50 tags. The response is the Policy.
message TagPolicyRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Policy"
  ];
  // 1-50 tags.
  repeated Tag tags = 2 [(google.api.field_behavior) = REQUIRED];
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// UntagPolicy removes the named keys from a managed policy. A key that is
// not attached is ignored. The response is the Policy.
message UntagPolicyRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Policy"
  ];
  // 1-50 keys, 1-128 characters each, same alphabet as Tag.key.
  repeated string tag_keys = 2 [(google.api.field_behavior) = REQUIRED];
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
}

// ListPolicyTags lists a policy's tags sorted by key. page_size defaults to
// 100; values above 1000 are coerced to 1000.
message ListPolicyTagsRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Policy"
  ];
  int32 page_size = 2;
  string page_token = 3;
}

message ListPolicyTagsResponse {
  repeated Tag tags = 1;
  string next_page_token = 2;
}
