syntax = "proto3";

package vws.iam.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/iam/v1;iamv1";
option java_multiple_files = true;
option java_outer_classname = "RoleProto";
option java_package = "dev.vws.iam.v1";

// RoleService manages IAM roles. A role is assumed through
// TokenService.AssumeRole; its trust policy says who may assume it.
// No node reconciles IAM. The server writes the resource and its status
// (observed.state READY, observed.generation = generation) in one store, so
// every operation of this service is returned done.
// Delete is FAILED_PRECONDITION / DEPENDENCY_MISSING while policies are
// attached or inline. Sessions already issued stay valid until they expire.
service RoleService {
  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (google.api.http) = {get: "/v1/{name=projects/*/roles/*}"};
  }

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/roles"};
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateRole(CreateRoleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/roles"
      body: "role"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Role"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateRole(UpdateRoleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{role.name=projects/*/roles/*}"
      body: "role"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Role"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteRole(DeleteRoleRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/roles/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.iam.v1.Role"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }
}

// Role is an IAM role.
// Fields 1-10 are the shared resource envelope.
message Role {
  option (google.api.resource) = {
    type: "vws.iam/Role"
    pattern: "projects/{project}/roles/{role}"
    plural: "roles"
    singular: "role"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  RoleSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  RoleStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message RoleSpec {
  string path = 1;
  // Trust policy (AssumeRolePolicyDocument), JSON. Its statements name
  // principals and the sts:AssumeRole action. Required.
  string assume_role_policy = 2 [(google.api.field_behavior) = REQUIRED];
  // 3600 to 43200. Zero means 3600.
  int32 max_session_duration_seconds = 3;
  repeated string attached_policies = 4;
  map<string, string> inline_policies = 5;
  string description = 6;
}

message RoleStatus {
  vws.common.v1.ObservedState observed = 1;
  // arn:vws:iam::{project}:role{path}{role}
  string arn = 2;
  // "AROA" followed by 17 uppercase letters and digits.
  string unique_id = 3;
}

message GetRoleRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
}

message ListRolesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/Role"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListRolesResponse {
  repeated Role roles = 1;
  string next_page_token = 2;
}

message CreateRoleRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.iam/Role"
  ];
  // Final path segment. Must match IamName (docs/validation.md): [A-Za-z0-9+=,.@_-], 1 to 64 characters, unique per project ignoring case.
  string role_id = 2 [(google.api.field_behavior) = REQUIRED];
  Role role = 3 [(google.api.field_behavior) = REQUIRED];
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateRoleRequest {
  Role role = 1 [(google.api.field_behavior) = REQUIRED];
  // Paths are relative to Role. status and output-only fields are rejected.
  // Omitted mask is treated as "spec,labels".
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  bool allow_missing = 5 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteRoleRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.iam/Role"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}
