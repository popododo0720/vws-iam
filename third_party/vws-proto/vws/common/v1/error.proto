syntax = "proto3";

package vws.common.v1;

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/common/v1;commonv1";
option java_multiple_files = true;
option java_outer_classname = "ErrorProto";
option java_package = "dev.vws.common.v1";

// ErrorReason is carried in google.rpc.ErrorInfo.reason.
// google.rpc.ErrorInfo.domain is always "vws.dev".
// The reason string is the enum name with the "ERROR_REASON_" prefix removed.
//
// Code mapping:
//
//	NOT_FOUND              RESOURCE_NOT_FOUND
//	ALREADY_EXISTS         ALREADY_EXISTS
//	INVALID_ARGUMENT       INVALID_RESOURCE_ID, INVALID_SPEC
//	ABORTED                IDEMPOTENCY_CONFLICT, ETAG_MISMATCH, GENERATION_CONFLICT
//	FAILED_PRECONDITION    DEPENDENCY_NOT_READY, DEPENDENCY_MISSING
//	RESOURCE_EXHAUSTED     QUOTA_EXCEEDED
//	UNAVAILABLE            RECONCILIATION_FAILED when retryable is true
//	INTERNAL               RECONCILIATION_FAILED when retryable is false
//	UNAUTHENTICATED        INVALID_CREDENTIALS, MFA_REQUIRED, TOKEN_EXPIRED
//	PERMISSION_DENIED      ACCESS_DENIED
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_RESOURCE_NOT_FOUND = 1;
  ERROR_REASON_ALREADY_EXISTS = 2;
  ERROR_REASON_INVALID_RESOURCE_ID = 3;
  ERROR_REASON_INVALID_SPEC = 4;
  ERROR_REASON_IDEMPOTENCY_CONFLICT = 5;
  ERROR_REASON_ETAG_MISMATCH = 6;
  ERROR_REASON_GENERATION_CONFLICT = 7;
  ERROR_REASON_DEPENDENCY_NOT_READY = 8;
  ERROR_REASON_DEPENDENCY_MISSING = 9;
  ERROR_REASON_QUOTA_EXCEEDED = 10;
  ERROR_REASON_RECONCILIATION_FAILED = 11;
  // Unknown or inactive key, wrong password or MFA code, unknown session.
  ERROR_REASON_INVALID_CREDENTIALS = 12;
  // The user has an enabled MFA device and no code was sent.
  ERROR_REASON_MFA_REQUIRED = 13;
  // A temporary credential or session past its expiry.
  ERROR_REASON_TOKEN_EXPIRED = 14;
  // An IAM policy denied the call (AWS AccessDenied).
  ERROR_REASON_ACCESS_DENIED = 15;
}

// ReconciliationFailure is an extra detail on google.rpc.Status when a node
// reports ERROR_REASON_RECONCILIATION_FAILED. It is packed into
// google.protobuf.Any alongside google.rpc.ErrorInfo.
message ReconciliationFailure {
  string resource = 1;
  int64 generation = 2;
  string node = 3;
  string reason = 4;
  bool retryable = 5;
}
